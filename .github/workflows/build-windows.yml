name: Build StageLink VST3

on:
  workflow_dispatch:
  push:
    paths:
      - "reaper-sender/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        shell: powershell
        run: |
          cmake --version
          Write-Host "Building StageLink Sender..."

      - name: Configure
        shell: powershell
        run: |
          cmake `
            -S reaper-sender `
            -B reaper-sender/build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        shell: powershell
        run: |
          cmake `
            --build reaper-sender/build `
            --config Release `
            --parallel

      - name: Find generated VST3
        shell: powershell
        run: |
          Write-Host "Generated files:"
          Get-ChildItem `
            -Path reaper-sender/build `
            -Recurse `
            -Filter "*.vst3" |
          Select-Object FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: StageLink-Sender-VST3
          path: |
            reaper-sender/build/**/*StageLink*.vst3
          if-no-files-found: error