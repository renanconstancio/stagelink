name: Build StageLink VST3

on:
  workflow_dispatch:
  push:
    paths:
      - "reaper-sender/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S reaper-sender
          -B reaper-sender/build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build
        run: >
          cmake
          --build reaper-sender/build
          --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: StageLink-Sender-VST3
          path: reaper-sender/build/StageLinkSender_artefacts/Release/VST3/